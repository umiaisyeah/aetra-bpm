<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pembacaan Meter</title>
    <!-- Chart.js CDN untuk Visualisasi Diagram Lingkaran -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Variabel Warna Mode Terang */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --primary-color: #007bff;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            /* Variabel Warna Mode Gelap */
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #375a7f;
            --success-color: #2b8a3e;
            --warning-color: #e0a800;
            --danger-color: #c82333;
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .theme-toggle-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .theme-toggle-btn:hover {
            opacity: 0.9;
        }

        .filter-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        select {
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            margin-top: 10px;
        }

        .bg-success { background-color: var(--success-color); }
        .bg-warning { background-color: var(--warning-color); color: #000; }

        .stat-group {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .chart-container {
            position: relative;
            max-width: 320px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header & Mode Switcher -->
    <div class="header">
        <h2>Dashboard Pembacaan Meter</h2>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 Mode Gelap</button>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <label for="cycleSelect">Pilih Cycle:</label>
        <select id="cycleSelect" onchange="updateDashboard()">
            <!-- Option 1 - 15 generated dynamically -->
        </select>
    </div>

    <!-- Main Content Layout -->
    <div class="grid-layout">
        <!-- Status Summary Card -->
        <div class="card">
            <h3 id="cycleTitle">Status Cycle Pembacaan</h3>
            <p>Status Completion: <span id="completionBadge" class="status-badge">Completed</span></p>
            
            <div class="stat-group">
                <span>Total Pelanggan:</span>
                <strong id="totalPelanggan">0</strong>
            </div>
            <div class="stat-group">
                <span>Sudah Dibaca:</span>
                <strong id="sudahDibaca">0</strong>
            </div>
            <div class="stat-group">
                <span>Belum Dibaca:</span>
                <strong id="belumDibaca">0</strong>
            </div>
            <div class="stat-group">
                <span>Persentase Kemajuan:</span>
                <strong id="persentaseProgress">0%</strong>
            </div>
        </div>

        <!-- Diagram Lingkaran Card -->
        <div class="card">
            <h3>Visualisasi Status Pembacaan</h3>
            <div class="chart-container">
                <canvas id="cyclePieChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Data Dummy Pembacaan Meter Cycle 1 - 15
    const cycleData = {};
    for (let i = 1; i <= 15; i++) {
        const total = 100;
        // Membuat beberapa cycle otomatis selesai (completed) dan sebagian belum (in-progress)
        const sudah = (i % 3 === 0) ? total : Math.floor(Math.random() * 40) + 60; 
        cycleData[`Cycle ${i}`] = {
            total: total,
            sudahDibaca: sudah,
            belumDibaca: total - sudah
        };
    }

    let pieChart;

    // 2. Inisialisasi Dropdown Filter Cycle
    function initDropdown() {
        const select = document.getElementById("cycleSelect");
        for (let i = 1; i <= 15; i++) {
            const opt = document.createElement("option");
            opt.value = `Cycle ${i}`;
            opt.textContent = `Cycle ${i}`;
            select.appendChild(opt);
        }
    }

    // 3. Fungsi Update Dashboard ketika Filter Berubah
    function updateDashboard() {
        const selectedCycle = document.getElementById("cycleSelect").value;
        const data = cycleData[selectedCycle];

        document.getElementById("cycleTitle").innerText = `Status ${selectedCycle}`;
        document.getElementById("totalPelanggan").innerText = data.total;
        document.getElementById("sudahDibaca").innerText = data.sudahDibaca;
        document.getElementById("belumDibaca").innerText = data.belumDibaca;

        const percentage = ((data.sudahDibaca / data.total) * 100).toFixed(1);
        document.getElementById("persentaseProgress").innerText = `${percentage}%`;

        const badge = document.getElementById("completionBadge");
        if (data.sudahDibaca === data.total) {
            badge.innerText = "Completed";
            badge.className = "status-badge bg-success";
        } else {
            badge.innerText = "In Progress";
            badge.className = "status-badge bg-warning";
        }

        updateChart(data.sudahDibaca, data.belumDibaca);
    }

    // 4. Inisialisasi & Update Diagram Lingkaran (Chart.js)
    function updateChart(sudah, belum) {
        const ctx = document.getElementById('cyclePieChart').getContext('2d');
        const isDarkMode = document.body.getAttribute('data-theme') === 'dark';
        const textColor = isDarkMode ? '#e0e0e0' : '#333333';

        if (pieChart) {
            pieChart.destroy(); // Hapus chart lama sebelum membuat chart baru
        }

        pieChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Sudah Dibaca', 'Belum Dibaca'],
                datasets: [{
                    data: [sudah, belum],
                    backgroundColor: ['#28a745', '#dc3545'],
                    borderWidth: 2,
                    borderColor: isDarkMode ? '#1e1e1e' : '#ffffff'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: textColor
                        }
                    }
                }
            }
        });
    }

    // 5. Fitur Mode Gelap / Mode Terang
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById("themeBtn");
        
        if (body.getAttribute("data-theme") === "dark") {
            body.removeAttribute("data-theme");
            btn.innerText = "🌙 Mode Gelap";
        } else {
            body.setAttribute("data-theme", "dark");
            btn.innerText = "☀️ Mode Terang";
        }
        
        // Refresh chart agar warna label/border menyesuaikan dengan tema yang aktif
        const selectedCycle = document.getElementById("cycleSelect").value;
        const data = cycleData[selectedCycle];
        updateChart(data.sudahDibaca, data.belumDibaca);
    }

    // Inisialisasi awal saat halaman dimuat
    window.onload = function() {
        initDropdown();
        updateDashboard();
    };
</script>

</body>
</html>
