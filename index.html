<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Verifikasi & Billing</title>
  <style>
    :root {
      --bg-color: #f4f7fe;
      --card-bg: #ffffff;
      --text-main: #2b3674;
      --text-secondary: #a3112c;
      --border-color: #e0e5f2;
      --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
      --danger: #ee5d50;
      --danger-hover: #e34335;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    /* Top Navigation Bar / Header */
    .top-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 25px;
    }

    .navbar-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Profile & Logout Section (Pojok Kanan Atas) */
    .user-profile-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #4318ff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .user-details {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .user-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .user-role {
      font-size: 0.75rem;
      color: #a3eedc;
      font-weight: 600;
    }

    .btn-logout {
      background-color: var(--danger);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover {
      background-color: var(--danger-hover);
    }

    /* Dashboard Layout Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* Card Item Style */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .card-left {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #a3aed0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e85300;
    }

    .card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .card-icon {
      font-size: 1.8rem;
    }

    .card-count {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .card-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: #e85300;
    }
  </style>
</head>
<body>

  <!-- Top Navigation with User Data & Logout on Top Right -->
  <header class="top-navbar">
    <div class="navbar-title">Dashboard Status</div>
    
    <div class="user-profile-section">
      <div class="user-info">
        <div class="user-details">
          <span class="user-name" id="userName">Solihin / Kabul</span>
          <span class="user-role" id="userRole">Otorisator</span>
        </div>
        <div class="user-avatar" id="userAvatar">SK</div>
      </div>
      <button class="btn-logout" onclick="handleLogout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Keluar
      </button>
    </div>
  </header>

  <!-- Content Container (Tanpa Infinite Scroll) -->
  <main class="dashboard-grid" id="cardContainer">
    <!-- Card Data Rendered via JavaScript -->
  </main>

  <script>
    // Data statis tanpa infinite scroll
    const itemsData = [
      {
        title: "PERLU VERIFIKASI READING",
        subtitle: "Otoritas Solihin / Kabul",
        icon: "🔍",
        count: 8,
        statusText: "Otorisator"
      },
      {
        title: "READY FOR BILLING",
        subtitle: "Otoritas Pak Yaya",
        icon: "📋",
        count: 7,
        statusText: "Otorisator"
      },
      {
        title: "INVOICED & SENT EMAIL",
        subtitle: "Selesai Diproses",
        icon: "✅",
        count: 5,
        statusText: "Selesai"
      }
    ];

    // Fungsi untuk merender list data satu kali
    function renderCards() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = ''; // Clear container

      itemsData.forEach(item => {
        const cardHtml = `
          <div class="dashboard-card">
            <div class="card-left">
              <div class="card-title">${item.title}</div>
              <div class="card-subtitle">${item.subtitle}</div>
            </div>
            <div class="card-right">
              <div class="card-icon">${item.icon}</div>
              <div class="card-count">${item.count}</div>
              <div class="card-tag">${item.statusText}</div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    // Fungsi Logout
    function handleLogout() {
      const confirmLogout = confirm("Apakah Anda yakin ingin keluar?");
      if (confirmLogout) {
        // Logika redirect atau hapus session/token
        alert("Anda telah keluar.");
        // window.location.href = '/login.html';
      }
    }

    // Jalankan render saat halaman dimuat
    document.addEventListener('DOMContentLoaded', renderCards);
  </script>
</body>
</html>
